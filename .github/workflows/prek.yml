name: Prek

on:
  push:
    branches:
      - '**'

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install prek
        run: pip install prek

      - name: Run prek
        run: prek -a
